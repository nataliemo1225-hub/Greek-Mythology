    <ellipse cx="43" cy="21.4" rx="5.2" ry="2.2" transform="rotate(96 43 21.4)"/>
    <ellipse cx="36.6" cy="16.4" rx="5" ry="2.1" transform="rotate(118 36.6 16.4)"/>
    <!-- inner right leaves -->
    <ellipse cx="43.4" cy="46.6" rx="4.4" ry="1.9" transform="rotate(14 43.4 46.6)"/>
    <ellipse cx="44" cy="38.8" rx="4.4" ry="1.9" transform="rotate(32 44 38.8)"/>
    <ellipse cx="41.4" cy="31.4" rx="4.4" ry="1.9" transform="rotate(52 41.4 31.4)"/>
