    <ellipse cx="27.4" cy="16.4" rx="5" ry="2.1" transform="rotate(-118 27.4 16.4)"/>
    <!-- inner left leaves -->
    <ellipse cx="20.6" cy="46.6" rx="4.4" ry="1.9" transform="rotate(-14 20.6 46.6)"/>
    <ellipse cx="20" cy="38.8" rx="4.4" ry="1.9" transform="rotate(-32 20 38.8)"/>
    <ellipse cx="22.6" cy="31.4" rx="4.4" ry="1.9" transform="rotate(-52 22.6 31.4)"/>
    <ellipse cx="27.6" cy="25.4" rx="4.4" ry="1.9" transform="rotate(-74 27.6 25.4)"/>
    <!-- leaves: right branch (mirrored) -->
    <ellipse cx="48.4" cy="44" rx="5.2" ry="2.2" transform="rotate(38 48.4 44)"/>
    <ellipse cx="49.8" cy="36" rx="5.2" ry="2.2" transform="rotate(58 49.8 36)"/>
