<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 24" fill="none">
  <!-- horizontal rules -->
  <path d="M0 12 H104" stroke="#A87C2A" stroke-width="1"/>
  <path d="M152 12 H256" stroke="#A87C2A" stroke-width="1"/>
  <!-- center laurel sprig, horizontal -->
  <g stroke="#A87C2A" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M108 12 H148"/>
  </g>
  <g fill="#A87C2A">
    <!-- upper leaves -->
    <ellipse cx="114" cy="9.4" rx="4.6" ry="1.8" transform="rotate(-24 114 9.4)"/>
    <ellipse cx="122" cy="8.4" rx="4.6" ry="1.8" transform="rotate(-14 122 8.4)"/>
    <ellipse cx="130" cy="8" rx="4.6" ry="1.8" transform="rotate(-4 130 8)"/>
    <ellipse cx="138" cy="8.4" rx="4.6" ry="1.8" transform="rotate(14 138 8.4)"/>
    <ellipse cx="145" cy="9.4" rx="4.6" ry="1.8" transform="rotate(24 145 9.4)"/>
    <!-- lower leaves -->
    <ellipse cx="114" cy="14.6" rx="4.6" ry="1.8" transform="rotate(24 114 14.6)"/>
    <ellipse cx="122" cy="15.6" rx="4.6" ry="1.8" transform="rotate(14 122 15.6)"/>
    <ellipse cx="130" cy="16" rx="4.6" ry="1.8" transform="rotate(4 130 16)"/>
    <ellipse cx="138" cy="15.6" rx="4.6" ry="1.8" transform="rotate(-14 138 15.6)"/>
    <ellipse cx="145" cy="14.6" rx="4.6" ry="1.8" transform="rotate(-24 145 14.6)"/>
  </g>
  <!-- small diamonds flanking the sprig -->
  <rect x="100.5" y="10.5" width="3" height="3" transform="rotate(45 102 12)" fill="#A87C2A"/>
  <rect x="152.5" y="10.5" width="3" height="3" transform="rotate(45 154 12)" fill="#A87C2A"/>
</svg>
